" y="83.5" text-anchor="end" font-family="'Instrument Sans', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="600" font-size="10.2" fill="#e6c36a">Mammalia</text><rect x="512" y="74" width="226" height="12" fill="#1a1a1a"/><rect x="512" y="74" width="208.3" height="12" fill="#e6c36a" fill-opacity="0.88"/><text x="714.3" y="83.2" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.6" font-weight="500" fill="#000000">15.2% (1,010)</text><text x="504" y="113.5" text-anchor="end" font-family="'Instrument Sans', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="400" font-size="10.2" fill="#c4c4be">Lepidoptera</text><rect x="512" y="104" width="226" height="12" fill="#1a1a1a"/><rect x="512" y="104" width="23.4" height="12" fill="#6fd4e4" fill-opacity="0.85"/><text x="542.4" y="113.2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.6" fill="#b7b7b1">1.71% (2,682 / 157k)</text><text x="504" y="143.5" text-anchor="end" font-family="'Instrument Sans', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="400" font-size="10.2" fill="#c4c4be">Hymenoptera</text><rect x="512" y="134" width="226" height="12" fill="#1a1a1a"/><rect x="512" y="134" width="11.8" height="12" fill="#6fd4e4" fill-opacity="0.85"/><text x="530.8" y="143.2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.6" fill="#b7b7b1">0.86% (1,012 / 117k)</text><text x="504" y="173.5" text-anchor="end" font-family="'Instrument Sans', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="400" font-size="10.2" fill="#c4c4be">Diptera</text><rect x="512" y="164" width="226" height="12" fill="#1a1a1a"/><rect x="512" y="164" width="8.6" height="12" fill="#6fd4e4" fill-opacity="0.85"/><text x="527.6" y="173.2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.6" fill="#b7b7b1">0.63% (976 / 155k)</text><text x="504" y="203.5" text-anchor="end" font-family="'Instrument Sans', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="400" font-size="10.2" fill="#c4c4be">Hemiptera</text><rect x="512" y="194" width="226" height="12" fill="#1a1a1a"/><rect x="512" y="194" width="3.8" height="12" fill="#6fd4e4" fill-opacity="0.85"/><text x="522.8" y="203.2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.6" fill="#b7b7b1">0.28% (292 / 104k)</text><text x="504" y="233.5" text-anchor="end" font-family="'Instrument Sans', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="400" font-size="10.2" fill="#c4c4be">Orthoptera</text><rect x="512" y="224" width="226" height="12" fill="#1a1a1a"/><rect x="512" y="224" width="2.8" height="12" fill="#6fd4e4" fill-opacity="0.85"/><text x="521.8" y="233.2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.6" fill="#b7b7b1">0.17% (49 / 28k)</text><text x="504" y="263.5" text-anchor="end" font-family="'Instrument Sans', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="400" font-size="10.2" fill="#c4c4be">Coleoptera</text><rect x="512" y="254" width="226" height="12" fill="#1a1a1a"/><rect x="512" y="254" width="2.8" height="12" fill="#6fd4e4" fill-opacity="0.85"/><text x="521.8" y="263.2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.6" fill="#b7b7b1">0.17% (654 / 387k)</text><line x1="22" y1="318" x2="740" y2="318" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/><rect x="22" y="328" width="718" height="54" fill="#0c0c0c" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/><text x="36" y="347" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.4" font-weight="500" fill="#6fd4e4">THE ANNOTATION GAP: 92.5% OF SEQUENCED INSECT GENOMES ARE STILL UNANNOTATED</text><text x="36" y="365" font-family="'Instrument Sans', 'Avenir Next', 'Segoe UI', sans-serif" font-size="10.2" fill="#c4c4be">Only 456 of 6,063 insect reference genomes carry annotations (7.5% vs 31.7% in mammals); beetles sit at 0.17% sequenced.</text></svg>