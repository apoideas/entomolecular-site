t><line x1="358.3" y1="58" x2="358.3" y2="280" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/><text x="358.3" y="294" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.0" fill="#9a9a96">1M</text><text x="36" y="78" font-family="'Instrument Sans', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="500" font-size="10.8" fill="#f2f1ec">1. Described species</text><text x="376" y="78" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.6" fill="#c5eef5">151× more insect species</text><rect x="36" y="86" width="322.3" height="14" fill="#6fd4e4" fill-opacity="0.82"/><text x="352.3" y="96.5" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#000000">~1,000,000</text><rect x="36" y="104" width="146.8" height="14" fill="#e6c36a" fill-opacity="0.86"/><text x="176.8" y="114.5" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#000000">6,640</text><text x="36" y="148" font-family="'Instrument Sans', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="500" font-size="10.8" fill="#f2f1ec">2. Reference genomes (NCBI)</text><text x="376" y="148" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.6" fill="#c5eef5">25× thinner insect coverage</text><rect x="36" y="156" width="143.6" height="14" fill="#6fd4e4" fill-opacity="0.82"/><text x="173.6" y="166.5" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.8" font-weight="500" fill="#000000">6,063 (0.61%)</text><rect x="36" y="174" width="80.9" height="14" fill="#e6c36a" fill-opacity="0.86"/><text x="122.9" y="184.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.8" fill="#e6c36a">1,010 (15.2%)</text><text x="36" y="218" font-family="'Instrument Sans', 'Avenir Next', 'Segoe UI', sans-serif" font-weight="500" font-size="10.8" fill="#f2f1ec">